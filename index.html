function delItem(d,i){if(confirm('刪除此項目?')){gd(d).items=gd(d).items.filter(x=>x.id!=i);save()}}
function mv(d,i,s){const a=gd(d).items,k=a.findIndex(x=>x.id==i),j=k+s;if(j<0||j>=a.length)return;[a[k],a[j]]=[a[j],a[k]];save()}
function addCm(d,i){cmT={d,i};$('c_name').value=localStorage.getItem('nm')||'';$('c_text').value='';cmD.showModal()}
function saveCm(){const n=$('c_name').value||'匿名',t=$('c_text').value.trim();if(!t)return;localStorage.setItem('nm',n);
 (gi(cmT.d,cmT.i).comments||=[]).push({id:uid(),n,t,at:Date.now()});cmD.close();save()}
function delCm(d,i,c){const x=gi(d,i);x.comments=x.comments.filter(y=>y.id!=c);save()}
function addWish(){const name=prompt('地方名稱');if(!name)return;S.wish.unshift({id:uid(),name,cat:prompt('類別','餐飲')||'',note:prompt('重點','')||'',hours:'',map:prompt('Google Map 連結(可留空)','')||'',cid:'',addr:'',img:'',done:false});save()}
function editWish(i){const w=S.wish.find(x=>x.id==i);w.name=prompt('名稱',w.name)??w.name;w.cat=prompt('類別',w.cat)??w.cat;w.note=prompt('重點',w.note)??w.note;w.hours=prompt('營業時間',w.hours)??w.hours;w.map=prompt('Google Map 連結',w.map||'')??w.map;w.cid=(w.map.match(/cid=(\d+)/)||[])[1]||'';w.img=prompt('自訂圖片網址(可留空)',w.img||'')??w.img;save()}
function addNote(){const n=prompt('備註');if(n){S.notes.push(n);save()}}
function editNote(i){const n=prompt('備註',S.notes[i]);if(n!=null){S.notes[i]=n;save()}}
function editTitle(){const t=prompt('標題',S.title);if(t){S.title=t;save()}}
function resetD(){if(confirm('重設為原始行程?(本機修改會消失)')){S=JSON.parse(JSON.stringify(DEF));save()}}
function exportJ(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download='trip.json';a.click()}
function importJ(e){const r=new FileReader();r.onload=()=>{try{S=JSON.parse(r.result);save();toast('已匯入')}catch(x){alert('檔案格式錯誤')}};r.readAsText(e.target.files[0])}
function stat(t){$('st').textContent=t}
const DB="https://thailand-trip-2610-default-rtdb.asia-southeast1.firebasedatabase.app/trip.json";
function norm(d){fillImgs(d);d.days=d.days||[];d.days.forEach(x=>{x.items=x.items||[];x.items.forEach(i=>{i.comments=i.comments||[]})});d.wish=d.wish||[];d.notes=d.notes||[];if((d.v||0)<VER){migrate(d);d.updated=Date.now();needPush=true}return d}
function apply(d){if(!d){push();return}norm(d);if((d.updated||0)>(S.updated||0)){S=d;localStorage.setItem('trip3',JSON.stringify(S));render();toast('已更新最新行程');if(needPush){needPush=false;setTimeout(push,300)}}stat('☁ 已同步 '+new Date().toLocaleTimeString())}
async function push(){try{const r=await fetch(DB,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(S)});stat(r.ok?'☁ 已同步 '+new Date().toLocaleTimeString():'⚠ 同步失敗 ('+r.status+')')}catch(e){stat('⚠ 同步失敗')}}
async function pull(manual){try{const r=await fetch(DB);if(!r.ok){stat('⚠ 讀取失敗 ('+r.status+')');return}const d=await r.json();if(!d){push();return}norm(d);if((d.updated||0)>(S.updated||0))apply(d);else if((d.updated||0)<(S.updated||0))push();else stat('☁ 已同步 '+new Date().toLocaleTimeString());if(manual)toast('已同步')}catch(e){stat('⚠ 同步失敗')}}
function live(){try{const es=new EventSource(DB);const h=e=>{try{const m=JSON.parse(e.data);if(m.path==='/'&&e.type==='put')apply(m.data);else pull()}catch(x){}};es.addEventListener('put',h);es.addEventListener('patch',h);es.onerror=()=>stat('⚠ 重新連線中…')}catch(e){}}
render();stat('☁ 連線中');pull();live();setInterval(pull,30000);
</script></body></html>
